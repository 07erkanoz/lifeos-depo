# LifeOS paketleri, açık paket deposunda (lifeos-depo) çalışır: GitHub açık depolarda Actions'ı ücretsiz verir, gizli
# kaynak deposunun (LifeOSLinux) aylık kotası ise doldu (28.10.2026). Bu dosyanın kaynağı LifeOSLinux'ta
# depo/.github/workflows/paketler.yml; `tools/depo_is_akisi.sh` buraya taşır (docs/paketler.md).
#
# Paketi LifeOSLinux'tan, verilen etikette (ör. lifeos-v0.1.0-7) ya da dalda derler, LifeOS anahtarıyla imzalar ve bu
# deponun "depo" sürümüne koyar, aynılarını Cloudflare R2'ye de (tools/depo_r2.sh). pacman önce
# https://paket.lifeos.com.tr/paket adresine, olmazsa https://github.com/<bu depo>/releases/download/depo adresine bakar.
# Başlatan: `python3 tools/yayinla.py <paket>` (etiketi gönderir, bu işi çalıştırır, bitmesini bekler).
#
# Gerekenler (tools/depo_sirlari.sh hazırlar):
#   sır LIFEOS_PAKET_ANAHTARI   imza anahtarının gizli kısmı (ASCII)
#   sır LIFEOS_PAKET_PAROLASI   anahtarın parolası
#   sır LIFEOS_KAYNAK_TOKEN     LifeOSLinux'u okuyabilen token (yalnız o depo; site sürümleri için yazma da)
#   sır LIFEOS_TUIK_API_KEY     lifeos-hesap için doğrudan TÜİK bağlantısı
#   sır LIFEOS_SB_ANAHTARI      Secure Boot anahtarı: linux-lifeos ve refind-lifeos onunla imzalanır
#   sır LIFEOS_SB_SERTIFIKASI   (tools/guvenli_acilis_anahtari.sh; docs/guvenli-acilis.md)
#   sır R2_ERISIM_KIMLIGI, R2_GIZLI_ANAHTAR ve değişken R2_HESAP: paketlerin R2 kopyası (ISO ile aynı anahtar)

name: LifeOS paketleri

on:
  workflow_dispatch:
    inputs:
      paket:
        description: 'Paket (lifeos, lifeos-yonetim, lifeos-sistem, lifeos-magaza, lifeos-karsilama, lifeos-paneller, lifeos-masaustu, lifeos-konsol, lifeos-izin, lifeos-temalar, lifeos-acilis, lifeos-destek-ekibi, lifeos-ekip, lifeos-keyring, lifeos-folio, linux-lifeos, refind-lifeos, lifeos-ofis, lifeos-muzik, lifeos-zsh, calamares, orchis-kde-theme, win11-icon-theme, pardus-idevice-mounter)'
        required: true
      ref:
        description: "LifeOSLinux'ta etiket ya da dal (ör. lifeos-v0.1.0-7)"
        required: true
        default: main

permissions:
  contents: write   # bu deponun sürümlerine paket koymak için

# Depo veritabanını aynı anda iki iş değiştirmesin. Bir grupta 1 çalışan + 1 bekleyen durur; üçüncüsü bekleyeni
# iptal eder, bu yüzden tools/yayinla.py paketleri tek tek, bir öncekinin bitmesini bekleyerek başlatır.
concurrency:
  group: lifeos-depo
  cancel-in-progress: false

jobs:
  paket:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    defaults:
      run:
        shell: bash
    env:
      DEPO: ${{ github.repository }}
    steps:
      - name: Araçlar
        # GitHub's release downloads sometimes wait ten seconds before the first byte when many come at once, and pacman
        # gives up after ten seconds without data: every build failed so (05.11.2026). No download timeout here.
        run: |
          grep -q '^DisableDownloadTimeout' /etc/pacman.conf || sed -i '/^\[options\]/a DisableDownloadTimeout' /etc/pacman.conf
          pacman -Syu --noconfirm --needed git github-cli python pacman-contrib rclone

      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.LIFEOS_KAYNAK || '07erkanoz/LifeOSLinux' }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.LIFEOS_KAYNAK_TOKEN }}

      # The repository's own tools (depo_eski.py, depo_r2.sh) from main, whatever tag the package is built from: an
      # older tag has none of them, and its build stopped after the GitHub upload, before R2 (08.11.2026, refind-lifeos).
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.LIFEOS_KAYNAK || '07erkanoz/LifeOSLinux' }}
          ref: main
          token: ${{ secrets.LIFEOS_KAYNAK_TOKEN }}
          path: .depo-araclari
          sparse-checkout: tools

      - name: Hangi paket, hangi sürüm
        id: paket
        env:
          PAKET: ${{ inputs.paket }}
          REF: ${{ inputs.ref }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          paket=$PAKET; surum=
          [[ $REF == "$paket-v"* ]] && surum=${REF##*-v}
          [[ $paket =~ ^[a-z0-9-]+$ && -f packaging/$paket/PKGBUILD ]] || { echo "::error::packaging/$paket/PKGBUILD yok"; exit 1; }
          python3 tools/surum.py || { echo "::error::Kaynaktaki sürüm ile PKGBUILD tutmuyor"; exit 1; }
          pkgver=$(sed -n 's/^pkgver=//p' "packaging/$paket/PKGBUILD"); pkgrel=$(sed -n 's/^pkgrel=//p' "packaging/$paket/PKGBUILD")
          if [[ -n $surum && $surum != "$pkgver" && $surum != "$pkgver-$pkgrel" ]]; then
            echo "::error::Etiket $surum diyor, PKGBUILD $pkgver-$pkgrel"; exit 1
          fi
          echo "paket=$paket" >> "$GITHUB_OUTPUT"
          [[ -n $surum ]] && echo "etiket=$REF" >> "$GITHUB_OUTPUT" || true

      - name: LifeOS deposu
        # Some packages depend on others of ours (lifeos-yonetim on lifeos): the build container trusts the LifeOS key
        # from this checkout and adds [lifeos] as an installed system has it (lifeos_store/depo.py).
        run: |
          pacman-key --init
          pacman-key --add packaging/lifeos-keyring/lifeos.gpg
          pacman-key --lsign-key "$(cut -d: -f1 packaging/lifeos-keyring/lifeos-trusted)"
          python3 -c 'import sys; sys.path.insert(0, "."); from lifeos_store.depo import enable; enable()'
          pacman -Sy --noconfirm

      - name: Arch paketi ve Secure Boot anahtarı
        # linux-lifeos and refind-lifeos are Arch's packages signed with the LifeOS Secure Boot key
        # (tools/arch_imzali.py): pacman fetches Arch's newest one and checks its signature, the PKGBUILD gets its
        # version and metadata. The key is readable only by the build user, and only for this build.
        if: steps.paket.outputs.paket == 'linux-lifeos' || steps.paket.outputs.paket == 'refind-lifeos'
        env:
          SB_ANAHTAR: ${{ secrets.LIFEOS_SB_ANAHTARI }}
          SB_SERTIFIKA: ${{ secrets.LIFEOS_SB_SERTIFIKASI }}
          PAKET: ${{ steps.paket.outputs.paket }}
        run: |
          [[ -n $SB_ANAHTAR && -n $SB_SERTIFIKA ]] || { echo "::error::LIFEOS_SB_ANAHTARI ve LIFEOS_SB_SERTIFIKASI sırları gerekli"; exit 1; }
          python3 tools/arch_imzali.py hazirla "$PAKET" "$RUNNER_TEMP/arch"
          sb="$RUNNER_TEMP/sb"; mkdir -p "$sb"
          ( umask 077; printf '%s\n' "$SB_ANAHTAR" > "$sb/db.key"; printf '%s\n' "$SB_SERTIFIKA" > "$sb/db.crt" )
          echo "LIFEOS_SB_KEY=$sb/db.key" >> "$GITHUB_ENV"
          echo "LIFEOS_SB_CERT=$sb/db.crt" >> "$GITHUB_ENV"
          echo "SRCDEST=$RUNNER_TEMP/arch" >> "$GITHUB_ENV"

      - name: Hesap için TÜİK bağlantı kaynağı
        if: steps.paket.outputs.paket == 'lifeos-hesap'
        env:
          TUIK_KEY: ${{ secrets.LIFEOS_TUIK_API_KEY }}
        run: |
          [[ -n $TUIK_KEY ]] || { echo "::error::LIFEOS_TUIK_API_KEY sırrı gerekli"; exit 1; }
          pacman -S --noconfirm --needed python-cryptography
          kaynak="$RUNNER_TEMP/hesap-credentials"
          printf '%s' "$TUIK_KEY" | python3 tools/hesap_credentials.py "$kaynak"
          echo "LIFEOS_HESAP_CREDENTIAL_DIR=$kaynak" >> "$GITHUB_ENV"

      - name: Player için OpenSubtitles anahtarı
        if: steps.paket.outputs.paket == 'lifeos-player'
        env:
          OS_KEY: ${{ secrets.LIFEOS_OPENSUBTITLES_KEY }}
        run: |
          # LifeOS'un OpenSubtitles.com uygulama anahtarı: LifeOSLinux'ta git dışında (*.key), burada sırdan (docs/player.md)
          [[ -n $OS_KEY ]] || { echo "::error::LIFEOS_OPENSUBTITLES_KEY sırrı gerekli"; exit 1; }
          printf '%s\n' "$OS_KEY" > "$RUNNER_TEMP/opensubtitles.key"
          chmod 644 "$RUNNER_TEMP/opensubtitles.key"
          echo "LIFEOS_PLAYER_KEY_FILE=$RUNNER_TEMP/opensubtitles.key" >> "$GITHUB_ENV"

      - name: Derle
        run: |
          useradd -m derleyici
          echo 'derleyici ALL=(ALL) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/derleyici
          chown -R derleyici "$GITHUB_WORKSPACE"
          [[ -z ${LIFEOS_SB_KEY:-} ]] || chown -R derleyici "$RUNNER_TEMP/sb" "$SRCDEST"
          cd "packaging/${{ steps.paket.outputs.paket }}"
          if [[ '${{ steps.paket.outputs.paket }}' == lifeos-hesap ]]; then
            chown -R derleyici "$LIFEOS_HESAP_CREDENTIAL_DIR"
            sudo -u derleyici env LIFEOS_HESAP_CREDENTIAL_DIR="$LIFEOS_HESAP_CREDENTIAL_DIR" makepkg --syncdeps --noconfirm --cleanbuild --nocheck
            python3 ../../tools/hesap_credentials.py --verify-package "$(realpath "$(find . -maxdepth 1 -name '*.pkg.tar.zst' -print -quit)")"
          else
            sudo -u derleyici env LIFEOS_PLAYER_KEY_FILE="${LIFEOS_PLAYER_KEY_FILE:-}" LIFEOS_SB_KEY="${LIFEOS_SB_KEY:-}" \
              LIFEOS_SB_CERT="${LIFEOS_SB_CERT:-}" SRCDEST="${SRCDEST:-}" makepkg --syncdeps --noconfirm --cleanbuild --nocheck
          fi
          ls -l ./*.pkg.tar.zst

      - name: Geçici OpenSubtitles anahtarını temizle
        if: always() && steps.paket.outputs.paket == 'lifeos-player'
        run: rm -f -- "$RUNNER_TEMP/opensubtitles.key"

      - name: Geçici Secure Boot anahtarını temizle
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/sb"

      - name: Geçici TÜİK kaynağını temizle
        if: always() && steps.paket.outputs.paket == 'lifeos-hesap'
        run: rm -rf -- "$RUNNER_TEMP/hesap-credentials"

      - name: İmzala ve depoya koy
        env:
          ANAHTAR: ${{ secrets.LIFEOS_PAKET_ANAHTARI }}
          PAROLA: ${{ secrets.LIFEOS_PAKET_PAROLASI }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ -n $ANAHTAR ]] || { echo "::error::LIFEOS_PAKET_ANAHTARI sırrı yok: tools/depo_sirlari.sh"; exit 1; }
          export GNUPGHOME=$(mktemp -d); chmod 700 "$GNUPGHOME"
          umask 077; printf '%s' "$PAROLA" > "$GNUPGHOME/parola"; umask 022
          # No "batch" here: in batch mode gpg does not find a detached signature's file, and repo-add --verify fails.
          printf 'pinentry-mode loopback\npassphrase-file %s\n' "$GNUPGHOME/parola" > "$GNUPGHOME/gpg.conf"
          echo allow-loopback-pinentry > "$GNUPGHOME/gpg-agent.conf"
          printf '%s\n' "$ANAHTAR" | gpg --import
          ANAHTAR_KIMLIGI=$(gpg --with-colons --list-secret-keys | awk -F: '/^fpr/ {print $10; exit}')

          # The work folder lives outside the checkout: LifeOSLinux has a depo/ folder of its own (these workflows).
          is=$RUNNER_TEMP/yayin; mkdir -p "$is"; echo "IS=$is" >> "$GITHUB_ENV"; cd "$is"
          gh release view depo --repo "$DEPO" >/dev/null 2>&1 || \
            gh release create depo --repo "$DEPO" --title "LifeOS paket deposu" --latest=false \
              --notes "pacman deposu: Server = https://github.com/$DEPO/releases/download/depo"
          gh release download depo --repo "$DEPO" --pattern 'lifeos.db.tar.gz*' --pattern 'lifeos.files.tar.gz*' || true

          for paket in "$GITHUB_WORKSPACE"/packaging/${{ steps.paket.outputs.paket }}/*.pkg.tar.zst; do
            cp "$paket" .
            gpg --batch --detach-sign --no-armor -u "$ANAHTAR_KIMLIGI" "$(basename "$paket")"
          done
          repo-add --sign --key "$ANAHTAR_KIMLIGI" --verify lifeos.db.tar.gz ./*.pkg.tar.zst
          # Release dosyaları bağlantı olamaz: pacman'ın istediği lifeos.db, lifeos.db.tar.gz'nin kopyasıdır.
          for db in db files; do
            cp -L "lifeos.$db.tar.gz" "lifeos.$db.yeni"; mv -f "lifeos.$db.yeni" "lifeos.$db"
            rm -f "lifeos.$db.sig"  # repo-add made it a link to the .tar.gz.sig: cp would copy the file onto itself
            cp -L "lifeos.$db.tar.gz.sig" "lifeos.$db.sig"
          done
          gh release upload depo --repo "$DEPO" --clobber ./*.pkg.tar.zst ./*.pkg.tar.zst.sig \
            lifeos.db lifeos.db.sig lifeos.db.tar.gz lifeos.db.tar.gz.sig \
            lifeos.files lifeos.files.sig lifeos.files.tar.gz lifeos.files.tar.gz.sig
          rm -rf "$GNUPGHOME"
          # Her paketin en yeni üç sürümü kalır (tools/depo_eski.py): biri kullanılan, ikisi geri dönmek için.
          gh release view depo --repo "$DEPO" --json assets --jq '.assets[].name' |
            python3 "$GITHUB_WORKSPACE/.depo-araclari/tools/depo_eski.py" --tut 3 |
            while read -r eski; do [[ -n $eski ]] && gh release delete-asset depo "$eski" --repo "$DEPO" --yes; done || true

      - name: R2'ye de koy
        # The same signed files in Cloudflare R2: pacman's first address (lifeos_store/depo.py). GitHub keeps its copy.
        env:
          R2_HESAP: ${{ vars.R2_HESAP }}
          R2_ERISIM_KIMLIGI: ${{ secrets.R2_ERISIM_KIMLIGI }}
          R2_GIZLI_ANAHTAR: ${{ secrets.R2_GIZLI_ANAHTAR }}
        run: |
          if [[ -z $R2_ERISIM_KIMLIGI || -z $R2_GIZLI_ANAHTAR || -z $R2_HESAP ]]; then
            echo "::warning::R2 sırları yok: paket yalnız GitHub'da"; exit 0
          fi
          bash "$GITHUB_WORKSPACE/.depo-araclari/tools/depo_r2.sh" "$IS"

      - name: Sürüm notu
        if: steps.paket.outputs.etiket != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ETIKET: ${{ steps.paket.outputs.etiket }}
        run: |
          cd "$IS"
          gh release create "$ETIKET" --repo "$DEPO" --title "$ETIKET" --latest=false \
            --notes "$(git -C "$GITHUB_WORKSPACE" tag -l --format='%(contents)' "$ETIKET")" \
            ./*.pkg.tar.zst ./*.pkg.tar.zst.sig
