# LifeOS paket deposunun bütününü (GitHub'daki "depo" sürümü) Cloudflare R2'ye koyar: lifeoslinux kovası, paket/.
# paketler.yml her yeni paketi zaten iki yere koyar; bu iş akışı R2'den önceki paketleri taşımak ya da R2'yi
# GitHub'la yeniden eşitlemek için (tools/depo_r2.sh). İndirme GitHub'ın API yolundan: sürüm indirme adresi
# bozukken de çalışır (08.11.2026).
# Bu dosyanın kaynağı LifeOSLinux'ta depo/.github/workflows/depo-r2.yml; `tools/depo_is_akisi.sh` buraya taşır.
#
# Başlatan: `gh workflow run depo-r2.yml --repo 07erkanoz/lifeos-depo`
# Gerekenler: sırlar LIFEOS_KAYNAK_TOKEN, R2_ERISIM_KIMLIGI, R2_GIZLI_ANAHTAR; değişken R2_HESAP.

name: LifeOS deposu → R2

on:
  workflow_dispatch:
    inputs:
      hepsi:
        description: "Değişmemiş paketleri de yeniden yükle (üstbilgileri yenilensin)"
        type: boolean
        default: false

permissions:
  contents: read

# The package workflow changes the same files: one at a time.
concurrency:
  group: lifeos-depo
  cancel-in-progress: false

jobs:
  r2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.LIFEOS_KAYNAK || '07erkanoz/LifeOSLinux' }}
          ref: main
          token: ${{ secrets.LIFEOS_KAYNAK_TOKEN }}
          sparse-checkout: tools

      - name: Araçlar
        run: sudo apt-get update -q && sudo apt-get install -y -q rclone

      - name: Depoyu indir
        run: |
          sudo mkdir -p /mnt/depo && sudo chown "$USER" /mnt/depo
          gh release download depo --repo "$DEPO" --dir /mnt/depo
          # Her paketin yalnız en yeni üç sürümü taşınır (tools/depo_eski.py)
          ls /mnt/depo | python3 tools/depo_eski.py --tut 3 | (cd /mnt/depo && xargs -r rm -f --)
          ls /mnt/depo | wc -l; du -sh /mnt/depo

      - name: R2'ye koy
        env:
          R2_HESAP: ${{ vars.R2_HESAP }}
          R2_ERISIM_KIMLIGI: ${{ secrets.R2_ERISIM_KIMLIGI }}
          R2_GIZLI_ANAHTAR: ${{ secrets.R2_GIZLI_ANAHTAR }}
          R2_HEPSI: ${{ inputs.hepsi && '1' || '' }}
        run: bash tools/depo_r2.sh /mnt/depo
