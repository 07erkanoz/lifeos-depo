# LifeOS ISO, açık paket deposunda (lifeos-depo) derlenir: GitHub açık depolarda Actions'ı ücretsiz verir, kaynak
# (LifeOSLinux) gizli kalır. Bu dosyanın kaynağı LifeOSLinux'ta depo/.github/workflows/iso.yml; `tools/depo_is_akisi.sh`
# buraya taşır (docs/paketler.md).
#
# ISO, ev bağlantısına hiç uğramadan GitHub'ın makinesinde derlenir ve bu deponun "iso-…" sürümüne konur. GitHub bir
# sürüm dosyasını en çok 2 GB kabul eder: ISO parçalara bölünür, sürüm notu Windows'ta ve Linux'ta birleştirmeyi anlatır.
# Bütün ISO ayrıca Cloudflare R2'ye konur (tools/iso_r2.sh): lifeos.com.tr onu https://iso.lifeos.com.tr/<etiket>/
# altından tek dosya olarak verir, indirme trafiği ne GitHub parçalarına ne lifeos.com.tr sunucusuna kalır.
# LifeOS'un kendi paketleri (Calamares, Konsol, anahtar, temalar) imzalı [lifeos] deposundan gelir.
#
# Başlatan: `gh workflow run iso.yml --repo 07erkanoz/lifeos-depo -f ref=main` ya da Actions sekmesindeki düğme.
# Gerekenler: sır LIFEOS_KAYNAK_TOKEN (LifeOSLinux'u okuyabilen token; paketler.yml ile aynı); R2 için sırlar
# R2_ERISIM_KIMLIGI ve R2_GIZLI_ANAHTAR, değişken R2_HESAP (Cloudflare hesap kimliği). R2 sırları yoksa ISO yalnız
# GitHub'a konur, eskisi gibi.

name: LifeOS ISO

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "LifeOSLinux'ta dal ya da etiket"
        required: true
        default: main

permissions:
  contents: write   # bu deponun sürümlerine ISO koymak için

concurrency:
  group: lifeos-iso
  cancel-in-progress: false

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    # mkarchiso kurulacak sistemi bağlama noktalarıyla kurar: konteyner yetkili olmalı. Çalışma klasörü makinenin geniş
    # ikinci diskinde (/mnt): ISO derlemesi ~10 GB ister, kök diskte o kadar yer yok.
    container:
      image: archlinux:latest
      options: --privileged
      volumes:
        - /mnt:/mnt
    defaults:
      run:
        shell: bash
    env:
      DEPO: ${{ github.repository }}
    steps:
      - name: Araçlar
        # No pacman download timeout: GitHub's release downloads sometimes wait ten seconds before the first byte.
        run: |
          grep -q '^DisableDownloadTimeout' /etc/pacman.conf || sed -i '/^\[options\]/a DisableDownloadTimeout' /etc/pacman.conf
          pacman -Syu --noconfirm --needed archiso git github-cli python sudo mtools sbsigntools openssl rclone

      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.LIFEOS_KAYNAK || '07erkanoz/LifeOSLinux' }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.LIFEOS_KAYNAK_TOKEN }}

      - name: LifeOS anahtarı
        # [lifeos]'tan gelen paketler imzalı: derleyen pacman LifeOS anahtarına güvenmeli (paketler.yml ile aynı).
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          pacman-key --init
          pacman-key --add packaging/lifeos-keyring/lifeos.gpg
          pacman-key --lsign-key "$(cut -d: -f1 packaging/lifeos-keyring/lifeos-trusted)"
          df -h / /mnt

      - name: Profil
        run: python3 tools/prepare_profile.py --output /mnt/profil --lifeos-deposu

      - name: ISO
        # Secure Boot (docs/guvenli-acilis.md): the LifeOS Secure Boot key signs rEFInd and the kernel behind
        # Microsoft-signed shim; tools/guvenli_acilis_anahtari.sh put it here. Without the secret the USB starts with
        # Secure Boot off only, as before.
        env:
          SB_ANAHTAR: ${{ secrets.LIFEOS_SB_ANAHTARI }}
          SB_SERTIFIKA: ${{ secrets.LIFEOS_SB_SERTIFIKASI }}
        run: |
          imza=()
          if [[ -n $SB_ANAHTAR && -n $SB_SERTIFIKA ]]; then
            mkdir -p -m 700 /mnt/sb
            ( umask 077; printf '%s\n' "$SB_ANAHTAR" > /mnt/sb/db.key; printf '%s\n' "$SB_SERTIFIKA" > /mnt/sb/db.crt )
            imza=(--sb-key /mnt/sb/db.key --sb-cert /mnt/sb/db.crt)
          fi
          python3 tools/build_iso.py --profile /mnt/profil --work /mnt/is --output /mnt/cikti "${imza[@]}"
          rm -rf /mnt/sb
          [[ ${#imza[@]} -eq 0 ]] || touch /mnt/cikti/.guvenli-acilis

      - name: Sürüme koy
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
          ANAHTAR: ${{ secrets.LIFEOS_PAKET_ANAHTARI }}
          PAROLA: ${{ secrets.LIFEOS_PAKET_PAROLASI }}
          R2_HESAP: ${{ vars.R2_HESAP }}
          R2_ERISIM_KIMLIGI: ${{ secrets.R2_ERISIM_KIMLIGI }}
          R2_GIZLI_ANAHTAR: ${{ secrets.R2_GIZLI_ANAHTAR }}
        run: |
          cd /mnt/cikti
          etiket="iso-$(date -u +%Y%m%d-%H%M)"
          iso=$(ls ./*.iso | head -1); iso=${iso#./}
          sha256sum "$iso" > "$iso.sha256"
          # The SHA-256 file is signed with the LifeOS package key; LifeOS USB Oluşturucu checks it against the key
          # it carries (apps/usb/lifeos_usb/imza.py). Without the secret the release goes out unsigned, as before.
          imza=
          if [[ -n $ANAHTAR ]]; then
            export GNUPGHOME=$(mktemp -d); chmod 700 "$GNUPGHOME"
            umask 077; printf '%s' "$PAROLA" > "$GNUPGHOME/parola"; umask 022
            printf 'pinentry-mode loopback\npassphrase-file %s\n' "$GNUPGHOME/parola" > "$GNUPGHOME/gpg.conf"
            echo allow-loopback-pinentry > "$GNUPGHOME/gpg-agent.conf"
            printf '%s\n' "$ANAHTAR" | gpg --import
            gpg --batch --detach-sign --no-armor -u "$(gpg --with-colons --list-secret-keys | awk -F: '/^fpr/ {print $10; exit}')" "$iso.sha256"
            gpg --batch --verify "$iso.sha256.sig" "$iso.sha256"
            rm -rf "$GNUPGHOME"; unset GNUPGHOME
            imza="$iso.sha256.sig"
          fi
          # The whole image goes to R2 before GitHub: once the release is out, lifeos.com.tr links its R2 copy.
          tek=
          if [[ -n $R2_ERISIM_KIMLIGI && -n $R2_GIZLI_ANAHTAR && -n $R2_HESAP ]]; then
            bash "$GITHUB_WORKSPACE/tools/iso_r2.sh" /mnt/cikti "$etiket"
            tek="https://iso.lifeos.com.tr/$etiket/$iso"
          fi
          split -b 1900M -d -a 1 "$iso" "$iso.parca"
          rm -f "$iso"
          kaynak=$(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD)
          parcalar=$(ls "$iso".parca* | tr '\n' ' ')
          # 30.10.2026: the ISO grew past 3.8 GB and became three parts; the note said two and joined only parca0+parca1.
          sayi=$(ls "$iso".parca* | wc -l)
          birlestir=$(ls "$iso".parca* | sed 's/$/ +/' | tr '\n' ' ' | sed 's/ + $//')
          if [[ -f .guvenli-acilis ]]; then
            # The same steps as LifeOS USB Oluşturucu's guide and docs/guvenli-acilis.md (Mavi ekran rehberi).
            secure="**Secure Boot açık bilgisayarda** BIOS'a girmek gerekmez; mavi, İngilizce bir ekran bir kez LifeOS anahtarını eklemek ister. Kurulumdan sonra bir daha sormaz. Fareyle değil, ok tuşları ve Enter ile seçilir.

          - **LifeOS USB Oluşturucu ile (Windows):** yazma bitince **LifeOS'u bu bilgisayarda başlat**'a basın; program bir kod gösterir ve bilgisayarı USB'den açar. Mavi ekranda: 10 saniye içinde bir tuş → **Enroll MOK** → **Continue** → **Yes** → kodu yazın → **Reboot**.
          - **Açılış menüsünden açtıysanız:** **OK** → bir tuş → **Enroll key from disk** → **LIFEOS_USB** → **LifeOS.cer** → **Continue** → **Yes** → **Reboot**."
          else
            secure="Secure Boot kapalı olmalı."
          fi
          notlar="LifeOS geliştirme ISO'su: kaynak $REF ($kaynak), $(date -u '+%d.%m.%Y %H:%M') UTC.

          **En kolayı:** Windows'ta [LifeOS USB Oluşturucu](https://paket.lifeos.com.tr/usb/LifeOS-USB.exe) en güncel ISO'yu kendisi indirir, birleştirir, denetler ve USB belleğe yazar; aşağıdaki adımlara gerek kalmaz.

          ${tek:+**Tek dosya:** [$iso]($tek) — aşağıdaki parçaların birleşmiş hâli; özeti \`$iso.sha256\` ile denetleyin.

          }GitHub bir dosyayı en çok 2 GB kabul ettiği için ISO $sayi parçadır. Hepsini (ve .sha256 dosyasını) aynı klasöre indirip birleştirin:

          **Windows** (indirdiğiniz klasörde PowerShell ya da Komut İstemi):
          \`\`\`
          cmd /c copy /b $birlestir $iso
          certutil -hashfile $iso SHA256
          \`\`\`
          **Linux:** \`cat $iso.parca* > $iso && sha256sum -c $iso.sha256\`

          Çıkan özet \`$iso.sha256\` dosyasındakiyle aynı olmalı. Sonra Rufus ile USB'ye yazın (sorarsa \"DD kipi\").
          $secure"
          gh release create "$etiket" --repo "$DEPO" --title "LifeOS ISO $(date -u +%d.%m.%Y)" --prerelease \
            --notes "$notlar" $parcalar "$iso.sha256" $imza
          # Yalnız en yeni ISO kalır, GitHub'da da R2'de de. Eskiler ancak yenisi yayımlandıktan sonra silinir.
          gh release list --repo "$DEPO" --limit 100 --json tagName -q '.[].tagName' | grep '^iso-' | grep -vxF "$etiket" |
            while read -r eski; do gh release delete "$eski" --repo "$DEPO" --yes --cleanup-tag; done
          [[ -z $tek ]] || bash "$GITHUB_WORKSPACE/tools/iso_r2.sh" --yalniz "$etiket"
          echo "ISO: https://github.com/$DEPO/releases/tag/$etiket"
