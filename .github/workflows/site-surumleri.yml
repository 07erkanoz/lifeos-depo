# LifeOS Folio ve Ofis lifeos.com.tr'de yayımlanır; bu iş günde iki kez sitenin imzalı sürüm bilgisine bakar.
# Sitede daha yeni bir sürüm varsa tools/site_surum.py LifeOSLinux'taki PKGBUILD'i (sürüm, adres, SHA-256) günceller,
# değişiklik LifeOSLinux'a commit edilir; "Otomatik yayın" bir saat içinde o paketi derletip [lifeos] deposuna koyar. Mağaza da
# kullanıcıya güncellemeyi bildirir (docs/paketler.md · Site sürümleri). lifeos-zsh de aynı yolla Arch'ın zsh'ini izler.
# Açık depoda çalışır (Actions ücretsiz);
# kaynağı LifeOSLinux'ta depo/.github/workflows/site-surumleri.yml.

name: Site sürümleri

on:
  schedule:
    - cron: '17 6,15 * * *'
  workflow_dispatch:

permissions: {}   # yazma LifeOSLinux'a, LIFEOS_KAYNAK_TOKEN ile

concurrency:
  group: site-surumleri
  cancel-in-progress: false

jobs:
  denetle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.LIFEOS_KAYNAK || '07erkanoz/LifeOSLinux' }}
          ref: main
          token: ${{ secrets.LIFEOS_KAYNAK_TOKEN }}   # PKGBUILD değişikliğini LifeOSLinux'a koymak için yazma yetkili

      - name: Sitedeki sürümler
        id: site
        run: |
          python3 -c 'import cryptography' 2>/dev/null || pip install --quiet cryptography
          degisen=$(python3 tools/site_surum.py --guncelle)
          echo "paketler=$(echo $degisen)" >> "$GITHUB_OUTPUT"

      - name: Commit et
        if: steps.site.outputs.paketler != ''
        run: |
          git config user.name 'LifeOS paketleri'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          for paket in ${{ steps.site.outputs.paketler }}; do
            surum=$(sed -n 's/^pkgver=//p' "packaging/$paket/PKGBUILD")
            git commit -q -m "$paket $surum-1: kaynağın yeni sürümü" -- "packaging/$paket/PKGBUILD"
          done
          git push
          # Derleme "Otomatik yayın"da (otomatik-yayin.yml): aynı anda iki iş paket derletip birbirini iptal etmesin.
