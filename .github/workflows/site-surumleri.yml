# LifeOS Folio ve Ofis lifeos.com.tr'de yayımlanır; bu iş günde iki kez sitenin imzalı sürüm bilgisine bakar.
# Sitede daha yeni bir sürüm varsa tools/site_surum.py LifeOSLinux'taki PKGBUILD'i (sürüm, adres, SHA-256) günceller,
# değişiklik LifeOSLinux'a commit edilir ve "LifeOS paketleri" o paketi derleyip [lifeos] deposuna koyar. Mağaza da
# kullanıcıya güncellemeyi bildirir (docs/paketler.md · Site sürümleri). Açık depoda çalışır (Actions ücretsiz);
# kaynağı LifeOSLinux'ta depo/.github/workflows/site-surumleri.yml.

name: Site sürümleri

on:
  schedule:
    - cron: '17 6,15 * * *'
  workflow_dispatch:

permissions:
  actions: write   # paketler.yml'yi başlatmak için

concurrency:
  group: site-surumleri
  cancel-in-progress: false

jobs:
  denetle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.LIFEOS_KAYNAK || '07erkanoz/LifeOSLinux' }}
          ref: main
          token: ${{ secrets.LIFEOS_KAYNAK_TOKEN }}   # PKGBUILD değişikliğini LifeOSLinux'a koymak için yazma yetkili

      - name: Sitedeki sürümler
        id: site
        run: |
          python3 -c 'import cryptography' 2>/dev/null || pip install --quiet cryptography
          degisen=$(python3 tools/site_surum.py --guncelle)
          echo "paketler=$(echo $degisen)" >> "$GITHUB_OUTPUT"

      - name: Commit et ve derlet
        if: steps.site.outputs.paketler != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'LifeOS paketleri'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          for paket in ${{ steps.site.outputs.paketler }}; do
            surum=$(sed -n 's/^pkgver=//p' "packaging/$paket/PKGBUILD")
            git commit -q -m "$paket $surum-1: lifeos.com.tr'deki sürüm" -- "packaging/$paket/PKGBUILD"
          done
          git push
          # En çok iki paket (Folio, Ofis): biri çalışır, öteki sırada bekler.
          for paket in ${{ steps.site.outputs.paketler }}; do
            gh workflow run paketler.yml --repo "$GITHUB_REPOSITORY" -f paket="$paket" -f ref=main
          done
